services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: infraai-pgvectory
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: salim077
      POSTGRES_DB: infraai
    ports:
      - "5433:5432"
    volumes:
      - infraai_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: infraai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - infraai_redisdata:/data

volumes:
  infraai_pgdata:
  infraai_redisdata: